# Local development / integration testing of the password worker.
# Not the production deployment: the API key is mounted as a file, never baked in.
#
#   PW_BIND_IP   host address to publish on (a LAN address, never 0.0.0.0)
#   PW_EXT_PORT  host port (default 8099)
services:
  password-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TN_IMAGE:-exampleuser/truenas-lldap-password-management:0.1.0}
    container_name: password-worker
    restart: unless-stopped
    environment:
      # No defaults on purpose: an unset value must fail loudly rather than
      # silently point at the wrong host.
      PW_LDAP_URI: ${PW_LDAP_URI:?set PW_LDAP_URI}
      PW_LDAP_BASE: ${PW_LDAP_BASE:?set PW_LDAP_BASE}
      PW_TN_WSS: ${PW_TN_WSS:?set PW_TN_WSS}
      PW_TN_KEY_FILE: /run/secrets/pw.key
      PW_LISTEN: 0.0.0.0:8099
      PW_BIND: "${PW_BIND_IP}:${PW_EXT_PORT:-8099}"
      PW_TRUSTED_SUBNETS: ${PW_TRUSTED_SUBNETS:?set PW_TRUSTED_SUBNETS}
      PW_MIN_LEN: ${PW_MIN_LEN:-8}
    ports:
      # Host-side publish only. A specific host address needs three segments
      # (address:published:container); never a bare 0.0.0.0 here.
      - "${PW_BIND_IP:?set PW_BIND_IP}:${PW_EXT_PORT:-8099}:8099"
    volumes:
      # The key file must exist; compose fails rather than starting without it.
      - type: bind
        source: ${PW_TN_KEY_FILE:?set PW_TN_KEY_FILE}
        target: /run/secrets/pw.key
        read_only: true
    user: "10001:10001"
